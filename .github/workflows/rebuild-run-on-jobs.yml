name: Rebuild run-on-jobs catalogue
# Recipes change often, so the Space files are rebuilt here instead of in each PR.
on:
  push:
    branches: [main]
    paths:
      - 'ocr/**'
      - 'transcription/**'
      - 'sam3/**'
      - 'vlm-object-detection/**'
      - 'video/**'
      - 'classification/**'
      - 'gliner/**'
      - 'embeddings/**'
      - 'vllm/**'
      - 'tools/build-catalog.py'
      - 'tools/run-on-jobs-template.html'
      - '.github/workflows/rebuild-run-on-jobs.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the Space files
        run: python3 tools/build-catalog.py
      - name: Commit changes and start the sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add run-on-jobs
          if git diff --cached --quiet; then
            echo "Space files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "run-on-jobs: rebuild catalogue"
          git push
          # A push made with this token doesn't start other workflows, so ask for the sync directly.
          gh workflow run sync-run-on-jobs.yml --ref main
