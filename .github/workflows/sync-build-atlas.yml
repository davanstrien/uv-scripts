name: Sync build-atlas → HF
on:
  push:
    branches: [main]
    paths: ['build-atlas/**', '.github/workflows/sync-build-atlas.yml']

permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/_sync-folder.yml
    with:
      folder: build-atlas
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
