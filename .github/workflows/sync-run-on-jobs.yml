name: Sync run-on-jobs → HF
# Generates the Space from the recipes, so recipe PRs don't need to commit generated files.
on:
  push:
    branches: [main]
    paths:
      - 'ocr/**'
      - 'transcription/**'
      - 'sam3/**'
      - 'vlm-object-detection/**'
      - 'video/**'
      - 'classification/**'
      - 'gliner/**'
      - 'embeddings/**'
      - 'vllm/**'
      - 'tools/build-catalog.py'
      - 'tools/run-on-jobs-template.html'
      - 'tools/run-on-jobs-assets/**'
      - '.github/workflows/sync-run-on-jobs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REPO_ID: uv-scripts/run-on-jobs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Generate the Space files
        run: |
          python3 tools/build-catalog.py --verify-models
          git add -f run-on-jobs

      - name: Gate — folder must be a superset of the Hub repo (guards --delete="*")
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash ./tools/verify-superset.sh run-on-jobs "$REPO_ID" space

      - uses: huggingface/hub-sync@64269e310f79686d68ea78fd189cd1dd7d5ce427 # v0.2.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ env.REPO_ID }}
          repo_type: space
          subdirectory: run-on-jobs
          hf_token: ${{ secrets.HF_TOKEN }}
