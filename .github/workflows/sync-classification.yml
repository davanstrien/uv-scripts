# .github/workflows/sync-classification.yml
name: Sync classification → HF
on:
  push:
    branches: [main]
    paths: ['classification/**', '.github/workflows/sync-classification.yml']
permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/_sync-folder.yml
    with:
      folder: classification
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
