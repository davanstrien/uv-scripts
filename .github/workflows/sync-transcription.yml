name: Sync transcription → HF
on:
  push:
    branches: [main]
    paths: ['transcription/**', '.github/workflows/sync-transcription.yml']

permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/_sync-folder.yml
    with:
      folder: transcription
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
