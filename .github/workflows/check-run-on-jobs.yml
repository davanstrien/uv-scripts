name: Check run-on-jobs catalogue
# Fails when a recipe changes without rebuilding the Space, or when a declared model leaves the Hub.
on:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Space files match the recipes, and declared models exist
        run: python3 tools/build-catalog.py --check --verify-models
