name: Check run-on-jobs catalogue
# Fails when a declared model leaves the Hub, or when a command would not run as pasted.
# On pull requests it checks a change before sync-run-on-jobs.yml publishes it.
on:
  pull_request:
    paths:
      - 'ocr/**'
      - 'transcription/**'
      - 'sam3/**'
      - 'vlm-object-detection/**'
      - 'video/**'
      - 'classification/**'
      - 'gliner/**'
      - 'embeddings/**'
      - 'vllm/**'
      - 'tools/build-catalog.py'
      - 'tools/run-on-jobs-template.html'
      - '.github/workflows/check-run-on-jobs.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Commands run as pasted and declared models exist
        run: python3 tools/build-catalog.py --verify-models
